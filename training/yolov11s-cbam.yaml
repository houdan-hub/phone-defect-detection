# YOLOv11s with CBAM attention mechanism
# Optimized for small object detection (scratch, bump, paint, crack)

nc: 4  # 类别数量：scratch, bump, paint, crack
scales: # 使用 s 版本的缩放系数
  s: [0.33, 0.50, 1024]

# ---------------------------------------------------------------------
# Backbone: 骨干网络（负责特征提取）
# ---------------------------------------------------------------------
backbone:
  - [-1, 1, Conv, [64, 3, 2]]  # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]] # 6
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]] # 8
  - [-1, 1, SPPF, [1024, 5]]    # 9
  - [-1, 1, C2PSA, [1024]]      # 10

# ---------------------------------------------------------------------
# Head:
# ---------------------------------------------------------------------
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 11
  - [[-1, 6], 1, Concat, [1]]  # 12 融合 P4
  - [-1, 2, C3k2, [512, False]] # 13

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 14
  - [[-1, 4], 1, Concat, [1]]  # 15 融合 P3
  - [-1, 2, C3k2, [256, False]] # 16
  - [-1, 1, CBAM, [7]]         # 17 🔥 核心：只在这里加注意力，精准捕捉极小点

  - [-1, 1, Conv, [256, 3, 2]] # 18
  - [[-1, 13], 1, Concat, [1]] # 19 融合 Head P4
  - [-1, 2, C3k2, [512, False]] # 20

  - [-1, 1, Conv, [512, 3, 2]] # 21
  - [[-1, 10], 1, Concat, [1]] # 22 融合 Head P5
  - [-1, 2, C3k2, [1024, True]] # 23

  - [[17, 20, 23], 1, Detect, [nc]] # Detect(P3, P4, P5)